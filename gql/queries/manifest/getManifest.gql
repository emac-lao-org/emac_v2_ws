  query getManifestCPQuery {
    emac_manifests(
      where: {
        wg_stt: { _eq: 3 }
        wr_stt: { _in: [0,1] }
        wt_stt: { _eq: 3 }
        wd_stt: { _eq: 3 }
      }
    ) {
      id
      manifest_date
      manifest_no
      note
      reference_number
      status
      security_seal
      relocate_date
      wt_stt
      wr_stt
      wg_stt
      wd_stt
      type_of_service {
        id
        name
        name_short
      }
      transporter_operations {
        transporter {
          tran_name
        }
      }
      generator {
        gen_name
      }
      disposal {
        dis_name
      }
    }
  }

  query getManifestPerQuery($id: uuid!) {
    emac_manifests(where: {gen_id: {_eq: $id}}) {
      id
      created_at
      manifest_date
      manifest_no
      note
      reference_number
      status
      wt_stt
      wr_stt
      wg_stt
      wd_stt
      security_seal
      relocate_date
      type_of_service {
        id
        name
        name_short
      }
      transporter_operations {
        transporter {
          tran_name
          id
        }
      }
      waste_operations_aggregate {
        aggregate {
          sum {
            weight_disposal
            weight_generator
          }
        }
      }
      generator {
        gen_name
        id
      }
      disposal {
        dis_name
      }
    }
  }
