query extensionTracking($extendedTypes: [String!], $statuses: [Int!]) {
  emac_extension_operations(
    where: {
      extended_type: { _in: $extendedTypes }
      status: { _in: $statuses }
    }
    order_by: { created_at: desc }
  ) {
    id
    cat_opt_id
    generator_id
    extended_type
    quota_extended
    time_extended
    old_date
    old_quota
    status
    comment
    attachment_url
    created_at
    updated_at
    generator {
      id
      gen_name
      gen_name_lo
      emac_id
    }
    catalog_operation {
      id
      cat_name
      custom_description
      expire_date
      quota_amount
      remaining_amount
      waste_category {
        code
        entry_type
        description_6_lo
      }
      catalog {
        id
        catalog_no
        created_at
      }
    }
  }
}
