mutation insert_wd_type_op($type_id: uuid = "", $dis_id: uuid = "", $type_id1: uuid = "") {
  insert_emac_disposal_type_operations(objects: {type_id: $type_id, dis_id: $dis_id}) {
    returning {
      dis_id
      type_id
      updated_at
    }
  }
  insert_emac_disposal_type_service_operations(objects: {disposal_id: $dis_id, type_id: $type_id1}) {
    returning {
      type_id
      disposal_id
      updated_at
    }
  }
}
